<!DOCTYPE html>

<head>

<title>Star render test 2 — exact widget markup</title>
<style>
body{background:#faf5ec;font-family:sans-serif;padding:20px}

.rating-area{margin:18px 0 2px}
.rating-area h3{font-size:26px;margin:0 0 8px;font-weight:600}
.rating-area .stars{display:flex;gap:4px}
.rating-area .stars button{border:0;background:none;padding:2px;cursor:pointer;line-height:1;width:34px;height:34px;flex:none}
.rating-area .star{font-size:30px;color:#a08d76}

</style>
</head>

<h2>Test A — plain stars (no button, no widget CSS)</h2>
